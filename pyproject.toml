[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mrouter"
dynamic = ["version"]
description = "Intelligent model router: multiplexes local LM Studio models and priced cloud gateways by capability, speed, cost, and reliability."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
tray = ["rumps"]

[project.scripts]
mrouter = "mrouter.__main__:main"

[tool.setuptools]
packages = ["mrouter"]

[tool.setuptools.dynamic]
version = { attr = "mrouter.__version__" }
